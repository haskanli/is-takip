services:
  - type: web
    name: is-takip
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: JIRA_WEBHOOK_SECRET
        generateValue: true
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATA_MODEL
        value: legacy
      - key: REQUIRE_AUTH
        value: "false"
      - key: VITE_REQUIRE_AUTH
        value: "false"
      - key: VITE_DATA_API
        value: "false"
      - key: APP_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: REMINDER_CRON_SECRET
        generateValue: true
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TASK_TEMPLATE
        value: corject_task_assignment
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: tr
      - key: WHATSAPP_GRAPH_VERSION
        value: v26.0
      - key: SLACK_BOT_TOKEN
        sync: false
