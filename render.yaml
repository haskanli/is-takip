services:
  - type: web
    name: is-takip
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JIRA_WEBHOOK_SECRET
        generateValue: true
